name: Offline mock checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked project tooling
        run: |
          python -m pip install uv==0.13.8
          uv sync --locked --group dev
      - name: Static checks
        run: |
          uv run --no-sync ruff check .
          uv run --no-sync ruff format --check .
          uv run --no-sync mypy src/agent_testbed
      - name: Offline tests (TCP disabled; no provider secrets)
        run: uv run --no-sync pytest -q -m 'not paid and not requires_docker'
      - name: Validate and run deterministic demonstration
        run: |
          uv run --no-sync agent-eval validate experiments/smoke-mock.yaml
          uv run --no-sync agent-eval dry-run experiments/smoke-mock.yaml
          uv run --no-sync agent-eval run experiments/smoke-mock.yaml
