<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="760" viewBox="0 0 1120 760" role="img" aria-labelledby="title desc">
<title id="title">Agent Testbed architecture</title>
<desc id="desc">Tasks, system configurations, and budgets enter a controller. Python, CLI, and HTTP adapters connect the system under test. Snapshots are independently graded and linked to reports. Private grading materials only enter the grading stage; metering and budget control span controlled execution.</desc>
