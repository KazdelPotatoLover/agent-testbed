<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title desc">
  <title id="title">Agent Testbed</title>
  <desc id="desc">Compare architectures. Follow the evidence. Quality, cost, latency, and reliability. Connected nodes represent different agent architectures evaluated within one framework.</desc>
  <defs>
